frr version 10.7
frr defaults traditional
hostname pe1
service integrated-vtysh-config
!
interface eth3
 description to customer site
 ip address 172.16.1.1/24
exit
!
ip route 192.168.1.0/24 172.16.1.2
!
interface eth1
 description to p1
 ip address 10.10.1.1/24
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth2
 description to p3
 ip address 10.10.4.1/24
 ip router isis CORE
 isis network point-to-point
exit
!
interface lo
 ip address 10.0.0.1/32
 ip router isis CORE
 isis passive
exit
!
router isis CORE
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
exit
!
mpls ldp
 router-id 10.0.0.1
 !
 address-family ipv4
  discovery transport-address 10.0.0.1
  label local allocate host-routes
  !
  interface eth1
  exit
  !
  interface eth2
  exit
  !
 exit-address-family
 !
exit
!
router bgp 65000
 bgp router-id 10.0.0.1
 no bgp default ipv4-unicast
 neighbor 10.0.0.2 remote-as 65000
 neighbor 10.0.0.2 update-source lo
 !
 address-family ipv4 unicast
  redistribute static
  neighbor 10.0.0.2 activate
  neighbor 10.0.0.2 next-hop-self
 exit-address-family
exit
!
end
