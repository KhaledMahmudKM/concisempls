frr version 10.7
frr defaults traditional
hostname p1
service integrated-vtysh-config
!
interface eth1
 description to pe1
 ip address 10.10.1.2/24
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth2
 description to p2
 ip address 10.10.2.1/24
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth3
 description to p3
 ip address 10.10.6.1/24
 ip router isis CORE
 isis network point-to-point
exit
!
interface lo
 ip address 10.0.0.11/32
 ip router isis CORE
 isis passive
exit
!
router isis CORE
 net 49.0001.0000.0000.0011.00
 is-type level-2-only
 metric-style wide
exit
!
mpls ldp
 router-id 10.0.0.11
 !
 address-family ipv4
  discovery transport-address 10.0.0.11
  label local allocate host-routes
  !
  interface eth1
  exit
  !
  interface eth2
  exit
  !
  interface eth3
  exit
  !
 exit-address-family
 !
exit
!
end
