frr version 10.7
frr defaults traditional
hostname pe1
service integrated-vtysh-config
!
interface eth1
 description to p1
 ip address 10.10.1.1/24
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth2
 description to p3
 ip address 10.10.4.1/24
 ip router isis CORE
 isis network point-to-point
exit
!
interface lo
 ip address 10.0.0.1/32
 ip router isis CORE
 isis passive
exit
!
router isis CORE
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
exit
!
mpls ldp
 router-id 10.0.0.1
 !
 address-family ipv4
  discovery transport-address 10.0.0.1
  label local allocate host-routes
  !
  interface eth1
  exit
  !
  interface eth2
  exit
  !
 exit-address-family
 !
exit
!
end
