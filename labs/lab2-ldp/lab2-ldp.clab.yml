# Chapter 4: five-router core running IS-IS and LDP
# Deploy:  sudo containerlab deploy -t lab2-ldp.clab.yml
# Destroy: sudo containerlab destroy -t lab2-ldp.clab.yml --cleanup
name: lab2-ldp

topology:
  defaults:
    sysctls:
      net.mpls.platform_labels: 1048575
      net.ipv4.ip_forward: 1
  nodes:
    pe1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/pe1/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
      exec:
        - "sysctl -w net.mpls.conf.eth1.input=1"
        - "sysctl -w net.mpls.conf.eth2.input=1"
    p1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/p1/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
      exec:
        - "sysctl -w net.mpls.conf.eth1.input=1"
        - "sysctl -w net.mpls.conf.eth2.input=1"
        - "sysctl -w net.mpls.conf.eth3.input=1"
    p2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/p2/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
      exec:
        - "sysctl -w net.mpls.conf.eth1.input=1"
        - "sysctl -w net.mpls.conf.eth2.input=1"
    p3:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/p3/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
      exec:
        - "sysctl -w net.mpls.conf.eth1.input=1"
        - "sysctl -w net.mpls.conf.eth2.input=1"
        - "sysctl -w net.mpls.conf.eth3.input=1"
    pe2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/pe2/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
      exec:
        - "sysctl -w net.mpls.conf.eth1.input=1"
        - "sysctl -w net.mpls.conf.eth2.input=1"
  links:
    - endpoints: ["pe1:eth1", "p1:eth1"]
    - endpoints: ["p1:eth2", "p2:eth1"]
    - endpoints: ["p2:eth2", "pe2:eth1"]
    - endpoints: ["pe1:eth2", "p3:eth1"]
    - endpoints: ["p3:eth2", "pe2:eth2"]
    - endpoints: ["p1:eth3", "p3:eth3"]
