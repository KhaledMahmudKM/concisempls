frr version 10.7
frr defaults traditional
hostname p1
service integrated-vtysh-config
!
interface eth1
 description to pe1
 ipv6 address fc00:10:1::2/64
 ipv6 router isis CORE
 isis network point-to-point
exit
!
interface eth2
 description to p2
 ipv6 address fc00:10:2::1/64
 ipv6 router isis CORE
 isis network point-to-point
exit
!
interface eth3
 description to p3
 ipv6 address fc00:10:6::1/64
 ipv6 router isis CORE
 isis network point-to-point
exit
!
interface lo
 ipv6 address fc00:0:11::1/128
 ipv6 router isis CORE
 isis passive
exit
!
router isis CORE
 net 49.0001.0000.0000.0011.00
 is-type level-2-only
 metric-style wide
 segment-routing srv6
  locator MAIN
 exit
exit
!
segment-routing
 srv6
  encapsulation
   source-address fc00:0:11::1
  exit
  locators
   locator MAIN
    prefix fcbb:bb00:11::/48
    format usid-f3216
   exit
   !
  exit
  !
 exit
 !
exit
!
end
