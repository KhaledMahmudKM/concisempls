frr version 10.7
frr defaults traditional
hostname pe1
service integrated-vtysh-config
!
interface eth3
 description RED site
 ip address 172.16.1.1/24
exit
!
vrf RED
 ip route 192.168.1.0/24 172.16.1.2
exit-vrf
!
interface eth1
 description to p1
 ipv6 address fc00:10:1::1/64
 ipv6 router isis CORE
 isis network point-to-point
exit
!
interface eth2
 description to p3
 ipv6 address fc00:10:4::1/64
 ipv6 router isis CORE
 isis network point-to-point
exit
!
interface lo
 ipv6 address fc00:0:1::1/128
 ipv6 router isis CORE
 isis passive
exit
!
router isis CORE
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
 segment-routing srv6
  locator MAIN
 exit
exit
!
segment-routing
 srv6
  encapsulation
   source-address fc00:0:1::1
  exit
  locators
   locator MAIN
    prefix fcbb:bb00:1::/48
    format usid-f3216
   exit
   !
  exit
  !
 exit
 !
exit
!
router bgp 65000
 bgp router-id 10.0.0.1
 no bgp default ipv4-unicast
 neighbor fc00:0:2::1 remote-as 65000
 neighbor fc00:0:2::1 update-source lo
 !
 segment-routing srv6
  locator MAIN
 exit
 !
 address-family ipv4 vpn
  neighbor fc00:0:2::1 activate
 exit-address-family
exit
!
router bgp 65000 vrf RED
 bgp router-id 10.0.0.1
 sid vpn per-vrf export auto
 !
 address-family ipv4 unicast
  redistribute static
  redistribute connected
  rd vpn export 10.0.0.1:10
  rt vpn both 65000:10
  export vpn
  import vpn
 exit-address-family
exit
!
end
