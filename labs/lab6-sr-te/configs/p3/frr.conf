frr version 10.7
frr defaults traditional
hostname p3
service integrated-vtysh-config
!
interface eth1
 description to pe1
 ip address 10.10.4.2/24
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth2
 description to pe2
 ip address 10.10.5.1/24
 ip router isis CORE
 isis network point-to-point
 isis metric 25
exit
!
interface eth3
 description to p1
 ip address 10.10.6.2/24
 ip router isis CORE
 isis network point-to-point
exit
!
interface lo
 ip address 10.0.0.13/32
 ip router isis CORE
 isis passive
exit
!
router isis CORE
 net 49.0001.0000.0000.0013.00
 is-type level-2-only
 metric-style wide
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing node-msd 8
 segment-routing prefix 10.0.0.13/32 index 13
exit
!
end
