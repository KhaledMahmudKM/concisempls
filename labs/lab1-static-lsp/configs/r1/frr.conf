frr version 10.7
frr defaults traditional
hostname r1
service integrated-vtysh-config
!
interface eth1
 ip address 10.1.1.1/24
exit
!
interface eth2
 ip address 10.1.12.1/24
exit
!
! Ingress LER: push label 100 for traffic to h2's subnet
ip route 10.2.2.0/24 10.1.12.2 label 100
!
ip route 10.1.23.0/24 10.1.12.2
!
end
