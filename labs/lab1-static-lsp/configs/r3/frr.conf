frr version 10.7
frr defaults traditional
hostname r3
service integrated-vtysh-config
!
interface eth1
 ip address 10.1.23.2/24
exit
!
interface eth2
 ip address 10.2.2.1/24
exit
!
! Egress LER: pop 200 and forward the IP packet to h2
mpls lsp 200 10.2.2.2 implicit-null
!
! Return direction is plain IP
ip route 10.1.1.0/24 10.1.23.1
!
end
