frr version 10.7
frr defaults traditional
hostname r2
service integrated-vtysh-config
!
interface eth1
 ip address 10.1.12.2/24
exit
!
interface eth2
 ip address 10.1.23.1/24
exit
!
! LSR: swap 100 -> 200 toward r3
mpls lsp 100 10.1.23.2 200
!
! Plain IP routes for the return direction and for h1/h2
ip route 10.1.1.0/24 10.1.12.1
ip route 10.2.2.0/24 10.1.23.2
!
end
