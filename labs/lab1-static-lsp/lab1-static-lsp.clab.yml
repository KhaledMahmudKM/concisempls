# Chapter 2: a hand-built LSP (h1 -> r1 -> r2 -> r3 -> h2) with static labels
# Deploy:  sudo containerlab deploy -t lab1-static-lsp.clab.yml
# Destroy: sudo containerlab destroy -t lab1-static-lsp.clab.yml --cleanup
name: lab1-static-lsp

topology:
  defaults:
    sysctls:
      net.mpls.platform_labels: 1048575
      net.ipv4.ip_forward: 1
  nodes:
    h1:
      kind: linux
      image: alpine:3.20
      exec:
        - "ip addr add 10.1.1.2/24 dev eth1"
        - "ip route replace default via 10.1.1.1"
    r1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/r1/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
      exec:
        - "sysctl -w net.mpls.conf.eth2.input=1"
    r2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/r2/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
      exec:
        - "sysctl -w net.mpls.conf.eth1.input=1"
        - "sysctl -w net.mpls.conf.eth2.input=1"
    r3:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/r3/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
      exec:
        - "sysctl -w net.mpls.conf.eth1.input=1"
    h2:
      kind: linux
      image: alpine:3.20
      exec:
        - "ip addr add 10.2.2.2/24 dev eth1"
        - "ip route replace default via 10.2.2.1"
  links:
    - endpoints: ["h1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r3:eth2", "h2:eth1"]
