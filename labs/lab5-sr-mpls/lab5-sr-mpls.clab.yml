# Chapters 9 and 10: L3VPN over SR-MPLS (IS-IS) with TI-LFA, no LDP
# Deploy:  sudo containerlab deploy -t lab5-sr-mpls.clab.yml
# Destroy: sudo containerlab destroy -t lab5-sr-mpls.clab.yml --cleanup
name: lab5-sr-mpls

topology:
  defaults:
    sysctls:
      net.mpls.platform_labels: 1048575
      net.ipv4.ip_forward: 1
  nodes:
    pe1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/pe1/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
      exec:
        - "ip link add RED type vrf table 10"
        - "ip link set RED up"
        - "ip link set eth3 master RED"
        - "ip link add BLUE type vrf table 20"
        - "ip link set BLUE up"
        - "ip link set eth4 master BLUE"
        - "sysctl -w net.mpls.conf.eth1.input=1"
        - "sysctl -w net.mpls.conf.eth2.input=1"
    p1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/p1/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
      exec:
        - "sysctl -w net.mpls.conf.eth1.input=1"
        - "sysctl -w net.mpls.conf.eth2.input=1"
        - "sysctl -w net.mpls.conf.eth3.input=1"
    p2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/p2/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
      exec:
        - "sysctl -w net.mpls.conf.eth1.input=1"
        - "sysctl -w net.mpls.conf.eth2.input=1"
    p3:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/p3/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
      exec:
        - "sysctl -w net.mpls.conf.eth1.input=1"
        - "sysctl -w net.mpls.conf.eth2.input=1"
        - "sysctl -w net.mpls.conf.eth3.input=1"
    pe2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/pe2/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
      exec:
        - "ip link add RED type vrf table 10"
        - "ip link set RED up"
        - "ip link set eth3 master RED"
        - "ip link add BLUE type vrf table 20"
        - "ip link set BLUE up"
        - "ip link set eth4 master BLUE"
        - "sysctl -w net.mpls.conf.eth1.input=1"
        - "sysctl -w net.mpls.conf.eth2.input=1"
    ce1:
      kind: linux
      image: alpine:3.20
      exec:
        - "ip addr add 172.16.1.2/24 dev eth1"
        - "ip addr add 192.168.1.1/32 dev lo"
        - "ip route replace default via 172.16.1.1"
    ce2:
      kind: linux
      image: alpine:3.20
      exec:
        - "ip addr add 172.16.2.2/24 dev eth1"
        - "ip addr add 192.168.2.1/32 dev lo"
        - "ip route replace default via 172.16.2.1"
    ce3:
      kind: linux
      image: alpine:3.20
      exec:
        - "ip addr add 172.16.1.2/24 dev eth1"
        - "ip addr add 192.168.1.1/32 dev lo"
        - "ip route replace default via 172.16.1.1"
    ce4:
      kind: linux
      image: alpine:3.20
      exec:
        - "ip addr add 172.16.2.2/24 dev eth1"
        - "ip addr add 192.168.2.1/32 dev lo"
        - "ip route replace default via 172.16.2.1"
  links:
    - endpoints: ["pe1:eth1", "p1:eth1"]
    - endpoints: ["p1:eth2", "p2:eth1"]
    - endpoints: ["p2:eth2", "pe2:eth1"]
    - endpoints: ["pe1:eth2", "p3:eth1"]
    - endpoints: ["p3:eth2", "pe2:eth2"]
    - endpoints: ["p1:eth3", "p3:eth3"]
    - endpoints: ["pe1:eth3", "ce1:eth1"]
    - endpoints: ["pe2:eth3", "ce2:eth1"]
    - endpoints: ["pe1:eth4", "ce3:eth1"]
    - endpoints: ["pe2:eth4", "ce4:eth1"]
