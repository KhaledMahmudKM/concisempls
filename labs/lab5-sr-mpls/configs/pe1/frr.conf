frr version 10.7
frr defaults traditional
hostname pe1
service integrated-vtysh-config
!
interface eth3
 description RED site
 ip address 172.16.1.1/24
exit
!
interface eth4
 description BLUE site
 ip address 172.16.1.1/24
exit
!
vrf RED
 ip route 192.168.1.0/24 172.16.1.2
exit-vrf
!
vrf BLUE
 ip route 192.168.1.0/24 172.16.1.2
exit-vrf
!
interface eth1
 description to p1
 ip address 10.10.1.1/24
 ip router isis CORE
 isis network point-to-point
 isis fast-reroute ti-lfa
exit
!
interface eth2
 description to p3
 ip address 10.10.4.1/24
 ip router isis CORE
 isis network point-to-point
 isis fast-reroute ti-lfa
exit
!
interface lo
 ip address 10.0.0.1/32
 ip router isis CORE
 isis passive
exit
!
router isis CORE
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing node-msd 8
 segment-routing prefix 10.0.0.1/32 index 1
exit
!
router bgp 65000
 bgp router-id 10.0.0.1
 no bgp default ipv4-unicast
 neighbor 10.0.0.2 remote-as 65000
 neighbor 10.0.0.2 update-source lo
 !
 address-family ipv4 vpn
  neighbor 10.0.0.2 activate
 exit-address-family
exit
!
router bgp 65000 vrf RED
 bgp router-id 10.0.0.1
 !
 address-family ipv4 unicast
  redistribute static
  redistribute connected
  label vpn export auto
  rd vpn export 10.0.0.1:10
  rt vpn both 65000:10
  export vpn
  import vpn
 exit-address-family
exit
!
router bgp 65000 vrf BLUE
 bgp router-id 10.0.0.1
 !
 address-family ipv4 unicast
  redistribute static
  redistribute connected
  label vpn export auto
  rd vpn export 10.0.0.1:20
  rt vpn both 65000:20
  export vpn
  import vpn
 exit-address-family
exit
!
end
